<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="MusicDan — VFD Dot-Matrix Note">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#17110c" />
      <stop offset="100%" stop-color="#070503" />
    </linearGradient>
    <radialGradient id="vfdGlow" cx="48%" cy="54%" r="48%">
      <stop offset="0%" stop-color="#ff8800" stop-opacity="0.26" />
      <stop offset="100%" stop-color="#ff8800" stop-opacity="0" />
    </radialGradient>
    <rect id="cell" width="9.5" height="9.5" rx="2.6" />
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#bg)" />
  <rect width="100" height="100" rx="22" fill="url(#vfdGlow)" />
  <!-- Dim unlit 5x5 VFD phosphor grid -->
  <g fill="#362a1d" opacity="0.72">
    <use href="#cell" x="17" y="17" />
    <use href="#cell" x="31" y="17" />
    <use href="#cell" x="17" y="31" />
    <use href="#cell" x="31" y="31" />
    <use href="#cell" x="59" y="31" />
    <use href="#cell" x="17" y="45" />
    <use href="#cell" x="31" y="45" />
    <use href="#cell" x="59" y="45" />
    <use href="#cell" x="59" y="59" />
    <use href="#cell" x="73" y="59" />
    <use href="#cell" x="45" y="73" />
    <use href="#cell" x="59" y="73" />
    <use href="#cell" x="73" y="73" />
  </g>
  <!-- Lit VFD cells forming a musical note + streaming danmaku sparks -->
  <g>
    <!-- Flag -->
    <use href="#cell" x="45" y="17" fill="#fff0d4" />
    <use href="#cell" x="59" y="17" fill="#ffd285" />
    <use href="#cell" x="73" y="17" fill="#ff981f" />
    <use href="#cell" x="73" y="31" fill="#ff8800" opacity="0.85" />
    <!-- Stem -->
    <use href="#cell" x="45" y="31" fill="#f3e5c8" />
    <use href="#cell" x="45" y="45" fill="#f3e5c8" />
    <!-- Danmaku flying spark -->
    <use href="#cell" x="73" y="45" fill="#ff981f" opacity="0.45" />
    <!-- Notehead -->
    <use href="#cell" x="17" y="59" fill="#ff8800" />
    <use href="#cell" x="31" y="59" fill="#ffb84d" />
    <use href="#cell" x="45" y="59" fill="#fff0d4" />
    <use href="#cell" x="17" y="73" fill="#d97200" />
    <use href="#cell" x="31" y="73" fill="#ff8800" />
  </g>
</svg>
