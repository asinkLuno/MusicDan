<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="MusicDan — Triode Note">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#17110c" />
      <stop offset="100%" stop-color="#070503" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="42%">
      <stop offset="0%" stop-color="#ff8800" stop-opacity="0.34" />
      <stop offset="55%" stop-color="#ff8800" stop-opacity="0.09" />
      <stop offset="100%" stop-color="#ff8800" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="brass" gradientUnits="userSpaceOnUse" x1="0" y1="14" x2="0" y2="86">
      <stop offset="0%" stop-color="#f5e3be" />
      <stop offset="58%" stop-color="#c9954c" />
      <stop offset="100%" stop-color="#875c24" />
    </linearGradient>
    <linearGradient id="filament" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe7b8" />
      <stop offset="50%" stop-color="#ff9a1f" />
      <stop offset="100%" stop-color="#eb6d00" />
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#bg)" />
  <rect width="100" height="100" rx="22" fill="url(#glow)" />
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Vacuum tube glass envelope -->
    <path
      d="M 31 64 L 31 35 A 19 19 0 0 1 69 35 L 69 64 A 8 8 0 0 1 61 72 L 39 72 A 8 8 0 0 1 31 64 Z"
      stroke="url(#brass)"
      stroke-width="3.6"
    />
    <!-- Subtle glass rim highlight -->
    <path d="M 37 33 A 13.5 13.5 0 0 1 50 22" stroke="#fff3db" stroke-width="2" opacity="0.35" />
    <!-- Tube cathode pins -->
    <line x1="40" y1="73" x2="40" y2="83" stroke="url(#brass)" stroke-width="3.6" />
    <line x1="50" y1="73" x2="50" y2="85" stroke="url(#brass)" stroke-width="3.6" />
    <line x1="60" y1="73" x2="60" y2="83" stroke="url(#brass)" stroke-width="3.6" />
    <!-- Heated filament bent into an eighth note -->
    <path d="M 52 55 L 52 31 Q 61 33 60 42" stroke="url(#filament)" stroke-width="4.4" />
    <ellipse cx="45.5" cy="56" rx="7.8" ry="5.8" transform="rotate(-18 45.5 56)" fill="url(#filament)" />
    <circle cx="44" cy="55" r="2.2" fill="#fff5df" />
  </g>
</svg>
