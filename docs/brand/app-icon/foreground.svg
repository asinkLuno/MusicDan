<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="MusicDan — Scanline Danmaku Note Foreground">
  <defs>
    <linearGradient id="barWarm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff8c0a" />
      <stop offset="65%" stop-color="#ffbe63" />
      <stop offset="100%" stop-color="#fff0d4" />
    </linearGradient>
  </defs>
  <g transform="translate(-3.5 1)">
    <!-- Flag top -->
    <rect x="46" y="19" width="32" height="5.4" rx="2.7" fill="#f3e5c8" />
    <rect x="82" y="19" width="6" height="5.4" rx="2.7" fill="#f3e5c8" opacity="0.32" />
    <!-- Flag second line -->
    <rect x="46" y="28" width="25" height="5.4" rx="2.7" fill="url(#barWarm)" />
    <rect x="75" y="28" width="9" height="5.4" rx="2.7" fill="#ff9d2e" opacity="0.35" />
    <!-- Stem upper -->
    <rect x="46" y="37" width="12" height="5.4" rx="2.7" fill="#e5d5b7" />
    <rect x="63" y="37" width="15" height="5.4" rx="2.7" fill="#e5d5b7" opacity="0.24" />
    <!-- Stem lower -->
    <rect x="46" y="46" width="12" height="5.4" rx="2.7" fill="#e5d5b7" />
    <rect x="63" y="46" width="10" height="5.4" rx="2.7" fill="#e5d5b7" opacity="0.18" />
    <!-- Notehead top -->
    <rect x="25" y="55" width="33" height="5.4" rx="2.7" fill="url(#barWarm)" />
    <rect x="63" y="55" width="13" height="5.4" rx="2.7" fill="#ff9d2e" opacity="0.28" />
    <!-- Notehead core -->
    <rect x="19" y="64" width="39" height="5.4" rx="2.7" fill="#ffe7bc" />
    <rect x="63" y="64" width="8" height="5.4" rx="2.7" fill="#ffe7bc" opacity="0.2" />
    <!-- Notehead base -->
    <rect x="25" y="73" width="27" height="5.4" rx="2.7" fill="#d98c2b" />
  </g>
</svg>
