name: Build Android APK

on:
  push:
    branches:
      - releases
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: yarn

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate NDK
        run: |
          ndk=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -n1)
          if [ -z "$ndk" ]; then
            sdkmanager --install "ndk;27.2.12479018" >/dev/null
            ndk="$ANDROID_HOME/ndk/27.2.12479018"
          fi
          echo "NDK_HOME=$ndk" >> "$GITHUB_ENV"

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile

      - name: Restore release keystore
        uses: actions/cache@v4
        with:
          path: android-signing
          key: android-release-keystore-v1

      - name: Generate release keystore and signing config
        env:
          KS_ALIAS: musicdan
          KS_STORE_PASS: musicdan
        run: |
          mkdir -p android-signing
          if [ ! -f android-signing/musicdan.keystore ]; then
            keytool -genkeypair -v \
              -keystore android-signing/musicdan.keystore \
              -alias "$KS_ALIAS" -keyalg RSA -keysize 2048 -validity 10950 \
              -storepass "$KS_STORE_PASS" -keypass "$KS_STORE_PASS" \
              -dname "CN=MusicDan, OU=MusicDan, O=StarMountain, C=CN"
          fi
          {
            echo "keyAlias=$KS_ALIAS"
            echo "keyPassword=$KS_STORE_PASS"
            echo "storeFile=$GITHUB_WORKSPACE/android-signing/musicdan.keystore"
            echo "storePassword=$KS_STORE_PASS"
          } > src-tauri/gen/android/keystore.properties

      - name: Build per-ABI APKs and upload to draft release
        uses: tauri-apps/tauri-action@v1
        env:
          MUSICDAN_BUILD_NUMBER: ${{ github.run_number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: yarn tauri
          mobile: android
          args: --apk --split-per-abi --target aarch64
          tagName: build-${{ github.run_number }}
          releaseName: 'MusicDan v__VERSION__ · Build ${{ github.run_number }}'
          releaseBody: 'Android release APK（CI 自动构建并签名，仅 arm64-v8a，适配绝大多数安卓手机）。'
          releaseDraft: true
          prerelease: false

      - name: Publish completed build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "build-${{ github.run_number }}" --draft=false --latest

      - name: Upload APKs as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: apks-per-abi
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
