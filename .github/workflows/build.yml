name: Build Android APK

on:
  push:
    branches:
      - releases
  workflow_dispatch:

# Serialize publication, including manual reruns of older builds.
concurrency:
  group: android-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  ANDROID_NDK_VERSION: '30.0.16248370'
  ANDROID_BUILD_TOOLS_VERSION: '37.0.0'

jobs:
  build:
    if: github.ref == 'refs/heads/releases'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Reject builds that are already published or superseded
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' | sed -n 's/^build-\([0-9][0-9]*\)$/\1/p' | sort -n | tail -n1)
          if [ -n "$latest" ] && [ "$latest" -ge "$GITHUB_RUN_NUMBER" ]; then
            echo "::error::Build $GITHUB_RUN_NUMBER is already published or superseded by build $latest. Trigger a new run instead of rerunning a published build."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.1'
          cache: yarn
          cache-dependency-path: |
            yarn.lock
            website/yarn.lock

      - name: Pin Yarn Classic
        run: corepack enable && corepack prepare yarn@1.22.22 --activate

      - name: Setup JDK and Gradle cache
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17.0.21+9'
          cache: gradle
          cache-dependency-path: |
            src-tauri/gen/android/**/*.gradle*
            src-tauri/gen/android/**/gradle-wrapper.properties
            src-tauri/gen/android/gradle.properties
            plugins/tauri-plugin-media/android/**/*.gradle*
            src-tauri/Cargo.lock

      - name: Install pinned Android SDK and NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" "build-tools;$ANDROID_BUILD_TOOLS_VERSION" "ndk;$ANDROID_NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: aarch64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android-ndk-${{ env.ANDROID_NDK_VERSION }}

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile

      - name: Test frontend
        run: yarn test

      - name: Test offline screenshot fixtures
        run: yarn test:fixtures

      - name: Install landing page dependencies
        run: yarn --cwd website install --frozen-lockfile

      - name: Install Chinese fonts for screenshots
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: Re-capture app screenshots and build release landing page
        run: |
          set -euo pipefail
          yarn dev > "$RUNNER_TEMP/musicdan-preview.log" 2>&1 &
          preview_pid=$!
          google-chrome --headless --disable-gpu --no-sandbox --no-first-run \
            --remote-debugging-port=9229 --remote-debugging-address=127.0.0.1 \
            --user-data-dir="$RUNNER_TEMP/musicdan-chrome" about:blank > "$RUNNER_TEMP/musicdan-chrome.log" 2>&1 &
          chrome_pid=$!
          trap 'kill "$preview_pid" "$chrome_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:1420/ > /dev/null && curl -fsS http://127.0.0.1:9229/json/version > /dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat "$RUNNER_TEMP/musicdan-preview.log" "$RUNNER_TEMP/musicdan-chrome.log"
            exit 1
          fi
          yarn build:release-site

      - name: Save fresh screenshots and landing page bundle
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-landing-page
          path: |
            artifacts/previews/app-*.png
            artifacts/previews/november-rain-*.png
            artifacts/previews/screenshots.json
            artifacts/releases/*.tar.gz
          if-no-files-found: error
          compression-level: 0

      - name: Restore release signing from Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for variable in KEYSTORE_BASE64 KS_ALIAS KS_STORE_PASS KS_KEY_PASS; do
            if [ -z "${!variable}" ]; then
              echo "::error::Missing signing secret: $variable. Migrate the existing keystore; never generate a replacement."
              exit 1
            fi
          done
          umask 077
          mkdir -p android-signing
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android-signing/musicdan.keystore
          keytool -list -keystore android-signing/musicdan.keystore -alias "$KS_ALIAS" -storepass:env KS_STORE_PASS > /dev/null
          python3 scripts/android-signing-properties.py

      - name: Read release version
        id: version
        run: echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Build per-ABI APKs and upload to draft release
        uses: tauri-apps/tauri-action@v1
        env:
          MUSICDAN_BUILD_NUMBER: ${{ github.run_number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: yarn tauri
          mobile: android
          args: --apk --split-per-abi --target aarch64
          tagName: build-${{ github.run_number }}
          releaseName: 'MusicDan v__VERSION__'
          releaseBody: |
            ## 📱 Android 用户请下载这个文件

            **[`MusicDan_${{ steps.version.outputs.version }}_arm64.apk`](https://github.com/${{ github.repository }}/releases/download/build-${{ github.run_number }}/MusicDan_${{ steps.version.outputs.version }}_arm64.apk)**

            ## ✨ v${{ steps.version.outputs.version }} 更新内容

            包含自 v0.4.1 发布以来的以下改动。

            ### 歌词与界面

            - 歌词背景加入氛围渐变与边缘光效，与整体视觉更统一。
            - 当前歌词行以渐变墨迹高亮并加大字号，前后歌词更柔和地退后，阅读更聚焦。
            - 双语歌词的翻译行排版更清晰。

            ### 应用图标

            - 换上全新的品牌应用图标：多语言“音乐”文字音符搭配深紫背景与薰衣草柔光，桌面与启动器图标同步更新。

            ## 📋 系统要求

            - 需要 **Android 7.0（API 24）及以上**。
            - 仅提供 arm64-v8a（64 位）安装包；暂不提供 32 位 armv7 和模拟器（x86/x86_64）的包。
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: false

      - name: Test Android media controls
        working-directory: src-tauri/gen/android
        run: ./gradlew :tauri-plugin-media:testDebugUnitTest

      - name: Verify signed APKs
        env:
          MUSICDAN_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          tools="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS_VERSION"
          shopt -s globstar nullglob
          apks=(src-tauri/gen/android/app/build/outputs/apk/**/release/*.apk)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo '::error::No release APK found'
            exit 1
          fi
          for apk in "${apks[@]}"; do
            "$tools/apksigner" verify --verbose "$apk"
            metadata=$("$tools/aapt" dump badging "$apk")
            [[ "$metadata" == *"package: name='ink.starmountain.musicdan' versionCode='$((1000000000 + MUSICDAN_BUILD_NUMBER))'"* ]]
            [[ "$metadata" == *"native-code: 'arm64-v8a'"* ]]
          done

      - name: Upload APKs as workflow artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: apks-per-abi
          path: src-tauri/gen/android/app/build/outputs/apk/**/release/*.apk
          if-no-files-found: error
          compression-level: 0

      - name: Upload rebuilt landing page to draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release upload "build-$GITHUB_RUN_NUMBER" "artifacts/releases/MusicDan_${APP_VERSION}_website.tar.gz"

      - name: Publish completed build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' | sed -n 's/^build-\([0-9][0-9]*\)$/\1/p' | sort -n | tail -n1)
          if [ -n "$latest" ] && [ "$latest" -ge "$GITHUB_RUN_NUMBER" ]; then
            echo "Build $GITHUB_RUN_NUMBER is not newer than published build $latest; leaving latest unchanged."
            exit 0
          fi
          gh release edit "build-$GITHUB_RUN_NUMBER" --draft=false --latest
          # Keep versioned build tags immutable; move this convenience tag only after publication.
          commit=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/build-$GITHUB_RUN_NUMBER" --jq '.object.sha')
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/latest" > /dev/null 2>&1; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/latest" -f sha="$commit" -F force=true
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/tags/latest -f sha="$commit"
          fi

      - name: Remove signing material
        if: always()
        run: rm -f android-signing/musicdan.keystore src-tauri/gen/android/keystore.properties
