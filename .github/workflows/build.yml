name: Build Android APK

on:
  push:
    branches:
      - releases
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: yarn

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate NDK
        run: |
          ndk=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -n1)
          if [ -z "$ndk" ]; then
            sdkmanager --install "ndk;27.2.12479018" >/dev/null
            ndk="$ANDROID_HOME/ndk/27.2.12479018"
          fi
          echo "NDK_HOME=$ndk" >> "$GITHUB_ENV"

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile

      - name: Cache debug keystore for stable signature across builds
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore

      - name: Build per-ABI APKs and upload to draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: yarn tauri
          mobile: android
          args: --apk --debug --split-per-abi --target aarch64 --target armv7
          tagName: v__VERSION__
          releaseName: 'MusicDan v__VERSION__'
          releaseBody: 'Android debug APK（CI 自动构建，按 CPU 架构分包：arm64-v8a 适配现代手机，armeabi-v7a 适配老款 32 位手机）。'
          releaseDraft: true
          prerelease: false

      - name: Upload APKs as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: apks-per-abi
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
