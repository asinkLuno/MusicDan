name: Migrate Android signing
run-name: Export encrypted Android signing key

on:
  workflow_dispatch:
    inputs:
      recipient_certificate:
        description: 'PEM certificate generated locally; keep its private key on your computer'
        required: true
        type: string

permissions:
  contents: read

jobs:
  export:
    if: github.ref == 'refs/heads/releases'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Keep the original cache path so its cache version matches existing entries.
      - name: Restore existing signing key
        uses: actions/cache/restore@v4
        with:
          path: android-signing
          key: android-release-keystore-v1
          fail-on-cache-miss: true

      - name: Encrypt existing signing key
        env:
          RECIPIENT_CERTIFICATE: ${{ inputs.recipient_certificate }}
        run: |
          umask 077
          test -s android-signing/musicdan.keystore
          printf '%s\n' "$RECIPIENT_CERTIFICATE" > "$RUNNER_TEMP/recipient.pem"
          openssl x509 -in "$RUNNER_TEMP/recipient.pem" -noout
          openssl cms -encrypt -binary -aes-256-cbc \
            -in android-signing/musicdan.keystore \
            -out "$RUNNER_TEMP/musicdan.keystore.cms" -outform DER \
            "$RUNNER_TEMP/recipient.pem"

      - name: Upload encrypted backup
        uses: actions/upload-artifact@v7.0.2
        with:
          name: encrypted-android-signing
          path: ${{ runner.temp }}/musicdan.keystore.cms
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Remove plaintext signing key
        if: always()
        run: rm -f android-signing/musicdan.keystore
