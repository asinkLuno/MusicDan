name: Build Android APK

# main → releases 同步后构建签名 arm64 APK。
# 这里只产出 Actions 工件，不创建 GitHub Release，也不占用服务器发布编号。
on:
  push:
    branches:
      - releases
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ANDROID_NDK_VERSION: '30.0.16248370'
  ANDROID_BUILD_TOOLS_VERSION: '37.0.0'

jobs:
  build:
    if: github.ref == 'refs/heads/releases'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Verify the commit came from main
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor refs/remotes/origin/main "$GITHUB_SHA"; then
            echo "::error::releases 只能包含 main 上已有的提交；请先把改动合入 main 并重新同步。"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.1'
          cache: yarn

      - name: Pin Yarn Classic
        run: corepack enable && corepack prepare yarn@1.22.22 --activate

      - name: Setup JDK and Gradle cache
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17.0.21+9'
          cache: gradle
          cache-dependency-path: |
            src-tauri/gen/android/**/*.gradle*
            src-tauri/gen/android/**/gradle-wrapper.properties
            src-tauri/gen/android/gradle.properties
            plugins/tauri-plugin-media/android/**/*.gradle*
            src-tauri/Cargo.lock

      - name: Install pinned Android SDK and NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" "build-tools;$ANDROID_BUILD_TOOLS_VERSION" "ndk;$ANDROID_NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: aarch64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android-ndk-${{ env.ANDROID_NDK_VERSION }}

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile

      # 签名材料只从 Secrets 读取；缺失时直接失败，绝不生成替代证书。
      - name: Restore release signing from Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for variable in KEYSTORE_BASE64 KS_ALIAS KS_STORE_PASS KS_KEY_PASS; do
            if [ -z "${!variable}" ]; then
              echo "::error::Missing signing secret: $variable. Migrate the existing keystore; never generate a replacement."
              exit 1
            fi
          done
          umask 077
          mkdir -p android-signing
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android-signing/musicdan.keystore
          keytool -list -keystore android-signing/musicdan.keystore -alias "$KS_ALIAS" -storepass:env KS_STORE_PASS > /dev/null
          python3 scripts/android-signing-properties.py

      - name: Read app version
        id: version
        run: echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      # tauri-action 负责调用 `tauri android build`；beforeBuildCommand 会执行 `yarn build`，
      # 其中包含强制静态检查门禁 `yarn quality`。
      - name: Build signed arm64 APK
        uses: tauri-apps/tauri-action@v1
        env:
          MUSICDAN_BUILD_NUMBER: ${{ github.run_number }}
        with:
          tauriScript: yarn tauri
          mobile: android
          args: --apk --split-per-abi --target aarch64
          uploadUpdaterJson: false

      - name: Verify APK and write checksum
        env:
          MUSICDAN_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          tools="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS_VERSION"
          shopt -s globstar nullglob
          apks=(src-tauri/gen/android/app/build/outputs/apk/arm64/release/*.apk)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one signed arm64 APK, found ${#apks[@]}"
            printf '%s\n' "${apks[@]}"
            exit 1
          fi
          apk="${apks[0]}"
          "$tools/apksigner" verify --verbose "$apk"
          metadata=$("$tools/aapt" dump badging "$apk")
          expected_code=$((1000000000 + MUSICDAN_BUILD_NUMBER))
          if [[ "$metadata" != *"package: name='ink.starmountain.musicdan' versionCode='$expected_code'"* ]]; then
            echo "::error::Unexpected application id or versionCode (expected $expected_code)"
            printf '%s\n' "$metadata"
            exit 1
          fi
          if [[ "$metadata" != *"native-code: 'arm64-v8a'"* ]]; then
            echo "::error::APK does not contain arm64-v8a"
            printf '%s\n' "$metadata"
            exit 1
          fi
          mkdir -p artifacts/ci
          name="MusicDan_${{ steps.version.outputs.version }}_arm64.apk"
          cp "$apk" "artifacts/ci/$name"
          (cd artifacts/ci && sha256sum "$name" > "$name.sha256")
          cat "artifacts/ci/$name.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: MusicDan_${{ steps.version.outputs.version }}_arm64-build-${{ github.run_number }}
          path: |
            artifacts/ci/MusicDan_${{ steps.version.outputs.version }}_arm64.apk
            artifacts/ci/MusicDan_${{ steps.version.outputs.version }}_arm64.apk.sha256
          if-no-files-found: error
          compression-level: 0

      - name: Remove signing material
        if: always()
        run: rm -f android-signing/musicdan.keystore src-tauri/gen/android/keystore.properties
